- pattern: "Claiming that a strict identifier-validation regex (e.g., a model-name pattern requiring a lowercase `org/id(:variant)` shape) is a correctness bug because it rejects externally valid formats such as uppercase characters, IDs missing a required separator, or previously documented default values"
  context: "When the validated input is internal configuration whose accepted values are effectively pinned to a fixed allowlist or a single supported provider, and no code path in the repository actually supplies the rejected formats"
  reason: "The narrow pattern deliberately encodes the only identifier shapes the project supports; scenarios about hypothetical callers pinning stale defaults or copying third-party catalog IDs are speculative, and throwing on out-of-scope input is the intended failure mode rather than a bug."
- pattern: "Recommending that duplicated hard-coded config literals (e.g., the same model identifier appearing in both an automation script and runtime source) be consolidated into a single imported shared constant to establish one source of truth"
  context: "When the modules live in deliberately separate layers (scripts/tooling vs. runtime source) with no existing dependency between them, and the equality of the values is coincidental rather than representing the same logical setting"
  reason: "Each layer intentionally owns its own copy so the modules stay decoupled; adding an import across the boundary would couple independent concerns whose values may legitimately diverge over time, so the duplication is accepted design rather than maintenance debt that must be fixed."
- pattern: "Flagging inconsistent handling of the same stale or deprecated caller-supplied input across two related CI workflows (e.g., one silently warns while the other fails mid-run) and demanding uniform upfront validation with explicit error output"
  context: "When the inconsistency only manifests for hypothetical caller configuration that no in-repo caller actually provides, and each workflow's behavior was chosen independently"
  reason: "Per-workflow handling of out-of-scope caller configuration is considered acceptable; requiring uniform error reporting for a scenario that does not occur in the repository is speculative polish rather than a correctness issue."
- pattern: "Suggesting a shared helper that both applies a constant adjustment and builds the request payload (e.g., a payload-builder function taking model/maxTokens/messages), to eliminate repetition of a one-line expression like `max_tokens: X + ALLOWANCE` across direct call sites"
  context: "When the repeated logic is a single explicit arithmetic use of a named constant at a small number of call sites, with no evidence of the sites drifting apart or any site having already missed the adjustment"
  reason: "Explicit `X + ALLOWANCE` at each call site is self-documenting and trivially reviewable; a helper that couples the adjustment to payload construction adds indirection and conflates concerns for negligible maintainability gain, so the DRY suggestion was rejected."
- pattern: "Reporting a correctness bug whose only failure scenario is a hypothetical future consumer passing their own model-calling function/callback that follows the documented contract literally and therefore omits an internal adjustment (e.g., a token or reasoning allowance)"
  context: "When no code in the change actually exhibits the failure, the custom-implementation path is an explicitly documented escape hatch, and the argument rests on an imagined integrator not knowing about model-specific requirements"
  reason: "Consumer-supplied implementations are an intentional escape hatch whose users take responsibility for their model's configuration; demanding refactors to protect speculative integrations that do not exist was seen as unfounded."
- pattern: "Flagging that an adjustment is 'applied in two different layers' because a managed caller/wrapper applies it automatically while hand-rolled request-construction call sites must add it manually"
  context: "When the two paths are deliberately different integration styles (a factory-created caller that owns request building vs. direct fetch/request construction) and the manual application is visible, explicit, and consistent at each direct site"
  reason: "Auto-adjustment inside the wrapper combined with explicit arithmetic at direct call sites is a deliberate visibility trade-off, not an inconsistency or latent bug; treating explicitness at call sites as a hidden-defect source misread the design."
- pattern: "Predicting token-budget starvation (reasoning/thinking consuming the answer budget) producing empty model responses that downstream stages silently treat as unparseable and keep all findings, used as justification for centralizing token handling"
  context: "When the predicted caller configuration does not exist anywhere in the codebase and the empty-response-to-conservative-keep fallback is intentional defensive behavior"
  reason: "The end-to-end failure narrative is speculative at every link and depends on a caller that doesn't exist; intentional fallback behavior triggered only by an imaginary integration does not justify a structural refactor."

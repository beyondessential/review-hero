name: Review Hero

on:
  workflow_call:
    inputs:
      trigger:
        description: "'checkbox' = only on PR body edit with checkbox checked, 'always' = every PR event"
        type: string
        default: checkbox
      model:
        description: "Claude model for review agents when a PR ticks the Claude checkbox, or when REVIEW_HERO_OPENROUTER_API_KEY is not set"
        type: string
        default: claude-sonnet-5
      runner:
        description: "GitHub Actions runner for the review job"
        type: string
        default: ubuntu-latest
      voters:
        description: "Voters per agent for a diff of 100 or more changed lines (>=2 enables consensus filtering to reduce noise). Smaller diffs run one voter"
        type: number
        default: 3
      concurrency:
        description: "Most review agent processes running at once, or 0 to leave the runner's memory and the provider's rate limits as the only limits"
        type: number
        default: 0
      ref:
        description: "Git ref of review-hero to use (e.g. main, v1, v1.2.0)"
        type: string
        default: v1
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key"
        required: false
      REVIEW_HERO_ANTHROPIC_API_KEY:
        description: "Anthropic API key (preferred over ANTHROPIC_API_KEY if both are set)"
        required: false
      ANTHROPIC_BASE_URL:
        description: "Custom base URL for the Anthropic API (e.g. for proxies)"
        required: false
      REVIEW_HERO_ANTHROPIC_BASE_URL:
        description: "Custom base URL for the Anthropic API (preferred over ANTHROPIC_BASE_URL if both are set)"
        required: false
      REVIEW_HERO_OPENROUTER_API_KEY:
        description: "OpenRouter API key, needed only when a PR description picks an OpenRouter model (an id containing '/')"
        required: false
      REVIEW_HERO_APP_ID:
        description: "Review Hero GitHub App ID — typically provided as an org-level secret"
        required: true
      REVIEW_HERO_PRIVATE_KEY:
        description: "Review Hero GitHub App private key — typically provided as an org-level secret"
        required: true
      REVIEW_HERO_BOOTSTRAP_BRANCH:
        description: "Optional branch to read config from when the default branch has no Review Hero config yet (useful during initial setup)"
        required: false

concurrency:
  group: review-hero-${{ github.event.pull_request.number }}

jobs:
  # spec: RUN#the-review-job
  # One job runs the review: triage, every agent and voter as concurrent
  # processes, consensus and the second look. The agents spend their time
  # waiting on the model, so one runner carries them all, and the shared setup
  # happens once. Posting runs in its own job (`post`, below), so the GitHub
  # App token never exists on a runner the agents ran on.
  review:
    # Evaluated without starting a runner, so a PR edit with no ticked box
    # costs nothing. Expressions have no regex, so it looks for a ticked box
    # with one or two spaces before the label. The PR template always carries
    # the label unticked, so looking for the label alone would start a runner
    # on every PR edit. The exact check in the first step accepts the same
    # spacing and is otherwise stricter (lowercase x, the marker after the
    # label), so this never skips a body it would accept. A body that passes
    # here but not there boots a runner that stops at that first step.
    if: >-
      inputs.trigger == 'always' ||
      ((github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'edited') &&
      (contains(github.event.pull_request.body, '[x] **Run Review Hero') ||
      contains(github.event.pull_request.body, '[x]  **Run Review Hero')))
    runs-on: ${{ inputs.runner }}
    # Recorded before any agent runs, so the posting job reads them as they
    # were, whatever an agent did to this runner afterwards.
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      voters: ${{ steps.triage.outputs.voters }}
      agent_names: ${{ steps.triage.outputs.agent_names }}
      agent_model: ${{ steps.triage.outputs.agent_model }}
      trusted_sha: ${{ steps.trusted-refs.outputs.caller }}
      review_hero_sha: ${{ steps.trusted-refs.outputs.review_hero }}
    # Time budget. Every step that reaches the network or a model has its own
    # limit, and the job's is their sum, so a slow or hung step is cut short
    # and the results are still uploaded for the posting job:
    #   checkouts      3 min each (12)
    #   setup         15 min (Node, npm ci, Claude CLI: 5 each)
    #   PR diff        2 min
    #   triage         5 min
    #   agents        40 min
    #   consensus      8 min
    #   second look   15 min
    #   upload         5 min
    # The remaining steps only read and copy local files.
    # The agent and checker drivers work to a deadline (TIME_BUDGET_MS) a
    # minute inside their step's limit: every process is cut to the time left,
    # and a retry only starts with enough left to be useful. So per-process
    # limits (a voter 20 min, a checker 6, a wrap-up 5) need not add up to
    # the step's, and results are written before the step would kill them.
    # Working files live under runner.temp, which is emptied for every job, so
    # a reused runner never feeds one review's files into the next. What the
    # posting job needs sits in runner.temp/review, uploaded as one artifact.
    timeout-minutes: 105
    steps:
      # ── Trigger check ────────────────────────────────────────────────
      - id: check
        uses: actions/github-script@v8
        with:
          script: |
            const trigger = '${{ inputs.trigger }}';
            if (trigger === 'always') {
              core.setOutput('should_run', 'true');
              return;
            }
            // checkbox mode: only run when checkbox is checked.
            // Check on opened (pre-ticked template), reopened, or edited.
            const action = context.payload.action;
            if (action !== 'edited' && action !== 'opened' && action !== 'reopened') {
              core.setOutput('should_run', 'false');
              return;
            }
            const body = context.payload.pull_request?.body ?? '';
            // One or two spaces after the box, as the job's `if:` looks for.
            core.setOutput('should_run', /\[x\] {1,2}\*\*Run Review Hero[^*\r\n]*\*\* <!-- #ai-review(-claude)? -->/.test(body));

      # spec: RUN#the-review-job
      # Callers that set ubuntu-slim before the review became one job would
      # otherwise see a large review stopped before it posts, with no clue why.
      - name: Warn about the ubuntu-slim time cap
        if: steps.check.outputs.should_run == 'true' && contains(inputs.runner, 'slim')
        run: echo "::warning::ubuntu-slim stops a job at 15 minutes, and every agent runs in this one job, so a large review may not finish. Set runner to ubuntu-latest."

      # ── Checkouts ────────────────────────────────────────────────────
      # spec: RUN#credentials
      # No checkout keeps credentials on disk: the agents can read any file on
      # the runner, and a prompt-injected agent could otherwise copy a token
      # into a finding that gets posted.
      #
      # The PR goes at the workspace root, where the agents run and the CLI
      # reads CLAUDE.md natively. It is checked out first because checking out
      # into the root clears whatever is already there.
      - name: Checkout caller repo (PR head)
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Config, custom agent prompts, suppressions, AI rules files and the Node
      # version are read from the repo's default branch — not the PR branch —
      # so a malicious PR cannot inject custom agents, modify ignore patterns,
      # or tamper with config values.
      - name: Checkout caller config (default branch)
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/review-hero
            .github/copilot-instructions.md
            .cursorrules
            .windsurfrules
            .clinerules
            .rules
            .cursor/rules
            .node-version
          sparse-checkout-cone-mode: false
          path: .caller-base
          persist-credentials: false

      # If the default branch has no Review Hero config and a bootstrap branch
      # is configured, read the config from the bootstrap branch instead. This
      # is useful during initial setup when the default branch doesn't have the
      # config yet.
      - name: Resolve trusted ref
        if: steps.check.outputs.should_run == 'true'
        id: resolve-trusted-ref
        env:
          BOOTSTRAP_BRANCH: ${{ secrets.REVIEW_HERO_BOOTSTRAP_BRANCH }}
        run: |
          if [ -f ".caller-base/.github/review-hero/config.yml" ]; then
            echo "is_bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Config found on default branch ($(git -C .caller-base rev-parse HEAD))"
          elif [ -n "$BOOTSTRAP_BRANCH" ]; then
            echo "is_bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No config on default branch, using bootstrap branch: $BOOTSTRAP_BRANCH"
          else
            echo "is_bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "No config on default branch and no bootstrap branch configured"
          fi

      - name: Checkout caller config (bootstrap branch)
        if: steps.check.outputs.should_run == 'true' && steps.resolve-trusted-ref.outputs.is_bootstrap == 'true'
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ secrets.REVIEW_HERO_BOOTSTRAP_BRANCH }}
          sparse-checkout: |
            .github/review-hero
            .github/copilot-instructions.md
            .cursorrules
            .windsurfrules
            .clinerules
            .rules
            .cursor/rules
            .node-version
          sparse-checkout-cone-mode: false
          path: .caller-base
          persist-credentials: false

      - name: Checkout review-hero
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          repository: beyondessential/review-hero
          ref: ${{ inputs.ref }}
          path: .review-hero
          persist-credentials: false

      # The commits the trusted checkouts landed on, for the posting job to
      # check out afresh: the same config and the same review-hero code,
      # without reading anything from this runner after the agents ran.
      - name: Record trusted refs
        if: steps.check.outputs.should_run == 'true'
        id: trusted-refs
        run: |
          echo "caller=$(git -C .caller-base rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "review_hero=$(git -C .review-hero rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── Setup ────────────────────────────────────────────────────────
      # The Node version comes from the trusted ref, never the PR.
      - name: Resolve Node.js version
        if: steps.check.outputs.should_run == 'true'
        id: node-version
        run: |
          version=""
          if [ -f .caller-base/.node-version ]; then
            version=$(tr -d '[:space:]' < .caller-base/.node-version)
          fi
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          # npm's download cache, keyed on review-hero's own lockfile (checked
          # out above). `npm ci` still checks every package against it.
          cache: npm
          cache-dependency-path: .review-hero/package-lock.json

      - name: Install review-hero dependencies
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 5
        run: npm ci --prefix .review-hero

      # spec: RUN#the-review-job
      # The newest release published at least a week ago, its dependencies
      # included, so a broken or compromised release has time to be caught
      # and pulled before any review runs it.
      - name: Install Claude CLI
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 5
        run: |
          before=$(node -e 'console.log(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString())')
          # The postinstall fetches the native binary, and npm blocks install
          # scripts unless the package is named.
          npm install -g --before="$before" \
            --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
          claude --version

      # ── Install global Claude rules ──────────────────────────────────
      # Override aggressive defaults in Claude Code's built-in system
      # prompt (e.g. the one-line-max comment rule) that otherwise act as
      # invisible "ghost rules" during review. Sourced from the trusted
      # review-hero checkout, never the PR branch.
      - name: Install global Claude rules
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/.claude"
          cp .review-hero/prompts/global-claude-md.md "$HOME/.claude/CLAUDE.md"

      # ── Read project context from caller config ──────────────────────
      - name: Read caller config
        if: steps.check.outputs.should_run == 'true'
        id: config
        run: |
          CONFIG=".caller-base/.github/review-hero/config.yml"
          if [ -f "$CONFIG" ]; then
            PROJECT=$(yq -r '.project // ""' "$CONFIG")
            DESCRIPTION=$(yq -r '.description // ""' "$CONFIG")
            if [ -n "$PROJECT" ] && [ -n "$DESCRIPTION" ]; then
              CONTEXT="You are reviewing a PR for **${PROJECT}**, ${DESCRIPTION}."
            elif [ -n "$PROJECT" ]; then
              CONTEXT="You are reviewing a PR for **${PROJECT}**."
            else
              CONTEXT=""
            fi
          else
            CONTEXT=""
          fi
          {
            echo "project_context<<REVIEW_HERO_EOF"
            echo "$CONTEXT"
            echo "REVIEW_HERO_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Get PR diff ──────────────────────────────────────────────────
      # Diff at the reviewed commit (the PR head as of the triggering
      # event), not the live PR head, so a push made while this run is
      # queued doesn't change what the agents see. The agents read the
      # same commit, and the orchestrator anchors comments to it.
      - name: Get PR diff
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api \
            -H "Accept: application/vnd.github.diff" \
            "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/pr.diff"

      # ── Triage ───────────────────────────────────────────────────────
      - name: Triage
        if: steps.check.outputs.should_run == 'true'
        id: triage
        timeout-minutes: 5
        env:
          DIFF_PATH: ${{ runner.temp }}/pr.diff
          FILTERED_DIFF_PATH: ${{ runner.temp }}/review/pr-filtered.diff
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_HERO_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.REVIEW_HERO_ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
          REVIEW_HERO_DIR: .review-hero
          CALLER_REPO_DIR: .caller-base
          VOTERS: ${{ inputs.voters }}
          DEFAULT_MODEL: ${{ inputs.model }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HAS_OPENROUTER_KEY: ${{ secrets.REVIEW_HERO_OPENROUTER_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          set +e
          node .review-hero/scripts/triage.mjs 2>&1 | tee "$RUNNER_TEMP/triage-run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::triage.mjs exited with status $rc (stdout/stderr are duplicated above via tee)"
            exit "$rc"
          fi

      # ── Detect AI rules (from trusted ref) ──────────────────────────
      - name: Detect AI rules
        if: steps.check.outputs.should_run == 'true'
        run: sh .review-hero/scripts/detect-ai-rules.sh "$RUNNER_TEMP/ai-rules.md" .caller-base

      # ── Run agents ───────────────────────────────────────────────────
      # Every agent and voter runs here as a Claude CLI process. Processes
      # start while the runner has memory to spare and the provider is not
      # throttling, up to `concurrency` when set. They get an allowlisted environment,
      # and this step carries no GitHub token in the first place.
      # The step's own time limit sits inside the job's, so a review whose
      # agents run long still leaves the orchestrator time to post.
      - name: Run review agents
        if: steps.check.outputs.should_run == 'true'
        timeout-minutes: 40
        # Shared with the second look below, so both drivers always run with
        # the same model, keys and limits. Each sets its own TIME_BUDGET_MS.
        env: &agent-env
          AGENTS: ${{ steps.triage.outputs.agents }}
          VOTERS: ${{ steps.triage.outputs.voters }}
          MAX_TURNS: ${{ steps.triage.outputs.max_turns }}
          AGENT_MODEL: ${{ steps.triage.outputs.agent_model }}
          AGENT_PROVIDER: ${{ steps.triage.outputs.agent_provider }}
          CONCURRENCY: ${{ inputs.concurrency }}
          RESULTS_DIR: ${{ runner.temp }}/review/results
          LOGS_DIR: ${{ runner.temp }}/review/logs
          CONSENSUS_PATH: ${{ runner.temp }}/review/consensus.json
          REVIEW_HERO_DIR: .review-hero
          CALLER_BASE_DIR: .caller-base
          DIFF_PATH: ${{ runner.temp }}/review/pr-filtered.diff
          AI_RULES_PATH: ${{ runner.temp }}/ai-rules.md
          PROJECT_CONTEXT: ${{ steps.config.outputs.project_context }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ANTHROPIC_API_KEY: ${{ steps.triage.outputs.agent_provider != 'openrouter' && (secrets.REVIEW_HERO_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY) || '' }}
          ANTHROPIC_BASE_URL: ${{ steps.triage.outputs.agent_provider == 'openrouter' && 'https://openrouter.ai/api' || secrets.REVIEW_HERO_ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.triage.outputs.agent_provider == 'openrouter' && secrets.REVIEW_HERO_OPENROUTER_API_KEY || '' }}
          # OpenRouter requests occasionally stall; failing one fast lets the CLI retry it.
          API_TIMEOUT_MS: ${{ steps.triage.outputs.agent_provider == 'openrouter' && '180000' || '600000' }}
          # Some CLI versions cap a model ID they do not know below its real window and refuse the prompt unsent.
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: ${{ steps.triage.outputs.agent_provider == 'openrouter' && '1000000' || '' }}
        # A minute inside the step's 40, so results land before it is killed.
        run: TIME_BUDGET_MS=2340000 node .review-hero/scripts/run-agents.mjs

      # ── Consensus ────────────────────────────────────────────────────
      # spec: RUN#second-look
      # Voter consensus per agent, before the GitHub token exists. It also
      # names the contested areas worth a second look.
      - name: Apply consensus
        if: always() && steps.check.outputs.should_run == 'true'
        id: consensus
        # Model calls only; bounded so a hung call cannot eat the orchestrator's
        # time. If it fails, the orchestrator posts without consensus, so the
        # failure does not fail the job: the posted review decides that.
        timeout-minutes: 8
        continue-on-error: true
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/review/results
          VOTERS: ${{ steps.triage.outputs.voters }}
          CONSENSUS_PATH: ${{ runner.temp }}/review/consensus.json
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_HERO_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.REVIEW_HERO_ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
        run: node .review-hero/scripts/consensus.mjs

      # ── Second look ──────────────────────────────────────────────────
      # Fresh checkers judge the contested findings, and confirmations count
      # as votes. Its own time limit keeps time for posting; cut short, it
      # leaves consensus as it stood.
      - name: Second look
        if: always() && steps.check.outputs.should_run == 'true' && steps.consensus.outputs.second_look == 'true'
        timeout-minutes: 15
        # Cut short, it leaves consensus as it stood, and the review still posts.
        continue-on-error: true
        env: *agent-env
        # A minute inside the step's 15, so verdicts land before it is killed.
        run: TIME_BUDGET_MS=840000 node .review-hero/scripts/run-checkers.mjs

      # ── Hand over to posting ─────────────────────────────────────────
      # The results, consensus outcome, logs and the diff the agents were
      # shown: the posting job's input, and the record for debugging.
      - name: Upload review results
        if: always() && steps.check.outputs.should_run == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review
          retention-days: 1
          if-no-files-found: ignore

  # spec: RUN#posting
  # Posting runs on a fresh runner, so the GitHub App token never exists
  # where the agents ran: the agents can write files there through their git
  # tools, and a file they wrote could otherwise run with the token. This job
  # checks out review-hero and the trusted config afresh, at the commits the
  # review job recorded before its agents ran, and reads the review's results
  # and consensus outcome only as data. It runs even when the review job
  # failed, and posts from whatever results it uploaded.
  post:
    needs: review
    if: always() && needs.review.outputs.should_run == 'true'
    runs-on: ubuntu-slim
    # Every step has a limit of its own, and together they fit the 15 minutes
    # ubuntu-slim allows a job.
    timeout-minutes: 15
    steps:
      - name: Checkout review-hero
        timeout-minutes: 1
        uses: actions/checkout@v6
        with:
          repository: beyondessential/review-hero
          ref: ${{ needs.review.outputs.review_hero_sha || inputs.ref }}
          path: .review-hero
          persist-credentials: false

      - name: Checkout caller config (trusted ref)
        timeout-minutes: 1
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.review.outputs.trusted_sha || github.event.repository.default_branch }}
          sparse-checkout: |
            .github/review-hero
            .node-version
          sparse-checkout-cone-mode: false
          path: .caller-base
          persist-credentials: false

      - name: Resolve Node.js version
        id: node-version
        run: |
          version=""
          if [ -f .caller-base/.node-version ]; then
            version=$(tr -d '[:space:]' < .caller-base/.node-version)
          fi
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        timeout-minutes: 2
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: .review-hero/package-lock.json

      - name: Install review-hero dependencies
        timeout-minutes: 2
        run: npm ci --prefix .review-hero

      # Missing when the review job failed before uploading; the orchestrator
      # then reports that every agent failed.
      - name: Download review results
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v8
        with:
          name: review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review

      - name: Prepare suppressions
        run: |
          SUPP=".caller-base/.github/review-hero/suppressions.yml"
          if [ -f "$SUPP" ]; then
            cp "$SUPP" "$RUNNER_TEMP/suppressions.yml"
            echo "Suppressions file found"
          else
            echo "[]" > "$RUNNER_TEMP/suppressions.yml"
            echo "No suppressions file"
          fi

      - name: Generate app token
        id: app-token
        timeout-minutes: 1
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEW_HERO_APP_ID }}
          private-key: ${{ secrets.REVIEW_HERO_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── Orchestrate ──────────────────────────────────────────────────
      # Posts from whatever results the review job uploaded: each voter's
      # result is written as soon as it settles.
      - name: Run orchestrator
        timeout-minutes: 7
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_HERO_REF: ${{ inputs.ref }}
          CONSENSUS_PATH: ${{ runner.temp }}/review/consensus.json
          # Posted from without consensus when the consensus step left no outcome.
          ARTIFACTS_DIR: ${{ runner.temp }}/review/results
          VOTERS: ${{ needs.review.outputs.voters }}
          AGENT_NAMES: ${{ needs.review.outputs.agent_names }}
          AGENT_MODEL: ${{ needs.review.outputs.agent_model }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SUPPRESSIONS_PATH: ${{ runner.temp }}/suppressions.yml
          GLOBAL_SUPPRESSIONS_PATH: .review-hero/suppressions.yml
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_HERO_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.REVIEW_HERO_ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
        run: |
          set -euo pipefail
          set +e
          node .review-hero/scripts/orchestrate.mjs 2>&1 | tee "$RUNNER_TEMP/orchestrate-run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::orchestrate.mjs exited with status $rc (stdout/stderr are duplicated above via tee)"
            exit "$rc"
          fi

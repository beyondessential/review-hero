name: Review Hero
on:
  pull_request:
    types: [opened, reopened, edited]

jobs:
  review:
    # On this job alone, so no other job can request an identity token for
    # the findings receiver.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/review.yml
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      findings-url: https://workhorse.bes.au/api/review-hero/rounds
    secrets: inherit

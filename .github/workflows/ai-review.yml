name: Review Hero
on:
  pull_request:
    types: [opened, reopened, edited]

jobs:
  review:
    # On this job alone, so no other job can request an identity token for
    # the findings receiver.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/review.yml
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      # Not set until the receiver exists. Until then, `standalone` has nothing
      # accepting the findings, so the inline review is posted as usual.
      # findings-url: https://workhorse.bes.au/api/review-hero/rounds
      per-issue-comments: standalone
      summary-comment: always
    secrets: inherit
